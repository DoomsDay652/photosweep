name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: Emulator sessions to run
        type: choice
        default: Skip emulator
        options:
          - Skip emulator
          - All ten
          - Midnight only
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sessions != 'Skip emulator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ten Android app sessions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTO_SWEEP_TEST_CASE: ${{ inputs.sessions == 'Midnight only' && 'com.dominic.photosweep.TenSessionSmokeTest#session01_midnight' || 'com.dominic.photosweep.TenSessionSmokeTest' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            bash tools/run_android_smoke.sh
      - name: Save emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-ten-session-tests
          path: |
            app/build/smoke-evidence/
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn

  build:
    needs: smoke
    if: ${{ always() && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') && inputs.sessions != 'Midnight only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Optimize artwork without changing pixels
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 -m unittest discover -s tools -p test_optimize_assets.py
          python3 tools/optimize_assets.py

      - name: Verify review logic
        run: |
          javac -d /tmp/photosweep-check app/src/main/java/com/dominic/photosweep/ReviewNavigation.java app/src/main/java/com/dominic/photosweep/ReviewUndo.java app/src/main/java/com/dominic/photosweep/AppServices.java app/src/main/java/com/dominic/photosweep/SwipeMotion.java app/src/main/java/com/dominic/photosweep/SwipeTheme.java app/src/main/java/com/dominic/photosweep/PhotoFit.java app/src/main/java/com/dominic/photosweep/ResetPolicy.java app/src/main/java/com/dominic/photosweep/PlayPolicy.java app/src/main/java/com/dominic/photosweep/HolidayThemes.java tests/ReviewLogicCheck.java tests/HolidayThemesCheck.java
          java -cp /tmp/photosweep-check com.dominic.photosweep.ReviewLogicCheck
          java -cp /tmp/photosweep-check com.dominic.photosweep.HolidayThemesCheck

      - name: Verify external account deletion logic
        run: node --test tests/AccountDeletionWebCheck.cjs

      - name: Restore optional owner account configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.PHOTO_SWEEP_FIREBASE_ANDROID_CONFIG }}
        run: |
          if [[ -n "$FIREBASE_CONFIG" ]]; then
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          fi

      - name: Restore private signing key
        shell: bash
        env:
          KEY_DATA: ${{ secrets.PHOTO_SWEEP_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PHOTO_SWEEP_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEY_DATA" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Both Photo Sweep repository secrets are required.'
            exit 1
          fi
          printf '%s' "$KEY_DATA" | base64 --decode > app/photosweep-signing.p12
          chmod 600 app/photosweep-signing.p12

      - name: Build signed installable APK
        env:
          ORG_GRADLE_PROJECT_privacyUrl: ${{ vars.PHOTO_SWEEP_PRIVACY_URL }}
          ORG_GRADLE_PROJECT_deletionUrl: ${{ vars.PHOTO_SWEEP_DELETION_URL }}
          PHOTO_SWEEP_KEYSTORE_PATH: ${{ github.workspace }}/app/photosweep-signing.p12
          PHOTO_SWEEP_STORE_PASSWORD: ${{ secrets.PHOTO_SWEEP_STORE_PASSWORD }}
        run: gradle :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify every packaged artwork pixel
        run: python3 tools/optimize_assets.py --verify-bundle app/build/outputs/bundle/release/app-release.aab

      - name: Verify Play crash diagnostics
        run: python3 tools/verify_release_bundle.py app/build/outputs/bundle/release/app-release.aab

      - name: Save crash diagnostics for download
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-crash-diagnostics
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            app/build/outputs/release-diagnostics.txt
            build/asset-optimization.json
          if-no-files-found: error

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Save Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-play-store-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

