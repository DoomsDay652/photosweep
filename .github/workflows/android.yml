name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify review logic
        run: |
          javac -d /tmp/photosweep-check app/src/main/java/com/dominic/photosweep/ReviewNavigation.java app/src/main/java/com/dominic/photosweep/ReviewUndo.java app/src/main/java/com/dominic/photosweep/AppServices.java app/src/main/java/com/dominic/photosweep/SwipeMotion.java tests/ReviewLogicCheck.java
          java -cp /tmp/photosweep-check com.dominic.photosweep.ReviewLogicCheck

      - name: Restore private signing key
        shell: bash
        env:
          KEY_DATA: ${{ secrets.PHOTO_SWEEP_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PHOTO_SWEEP_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEY_DATA" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Both Photo Sweep repository secrets are required.'
            exit 1
          fi
          printf '%s' "$KEY_DATA" | base64 --decode > app/photosweep-signing.p12
          chmod 600 app/photosweep-signing.p12

      - name: Build signed installable APK
        env:
          PHOTO_SWEEP_KEYSTORE_PATH: ${{ github.workspace }}/app/photosweep-signing.p12
          PHOTO_SWEEP_STORE_PASSWORD: ${{ secrets.PHOTO_SWEEP_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
