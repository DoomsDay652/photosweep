plugins { id 'com.android.application' }

def cfgFile = file('google-services.json')
def firebaseConfig = cfgFile.exists() ? new groovy.json.JsonSlurper().parse(cfgFile) : null
def androidClient = firebaseConfig?.client?.find { it.client_info.android_client_info.package_name == 'com.dominic.photosweep' }
def publicConfig = ['PRIVACY_URL': providers.gradleProperty('privacyUrl').getOrElse(''), 'DELETION_URL': providers.gradleProperty('deletionUrl').getOrElse('')]

android {
    buildFeatures { buildConfig true }
    namespace 'com.dominic.photosweep'
    compileSdk 36
    defaultConfig {
        applicationId 'com.dominic.photosweep'
        minSdk 30
        buildConfigField 'String', 'FIREBASE_API_KEY', groovy.json.JsonOutput.toJson(androidClient?.api_key?.getAt(0)?.current_key ?: '')
        buildConfigField 'String', 'FIREBASE_APP_ID', groovy.json.JsonOutput.toJson(androidClient?.client_info?.mobilesdk_app_id ?: '')
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', groovy.json.JsonOutput.toJson(firebaseConfig?.project_info?.project_id ?: '')
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', groovy.json.JsonOutput.toJson(androidClient?.oauth_client?.find { it.client_type == 3 }?.client_id ?: '')
        publicConfig.each { key, value -> buildConfigField 'String', key, groovy.json.JsonOutput.toJson(value) }
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.15'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('PHOTO_SWEEP_KEYSTORE_PATH')
            if (keyPath) storeFile file(keyPath)
            storePassword System.getenv('PHOTO_SWEEP_STORE_PASSWORD')
            keyAlias 'photosweep'
            keyPassword System.getenv('PHOTO_SWEEP_STORE_PASSWORD')
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // Theme artwork is referenced by runtime selections. Keep resources intact.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Present in the setup bundle so Play Console can enable product configuration.
// Guest/offline AppServices remains active until products and verification are configured.
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.0')
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.android.billingclient:billing:9.1.0'
}

// Opt-in production gate. Internal builds remain usable without owner configuration.
tasks.register('verifyPlayProduction') {
    doLast {
        if (!androidClient) throw new GradleException('Add the owner Firebase Android google-services.json.')
        publicConfig.each { key, value ->
            if (!value.startsWith('https://') || value.contains('example.') || value.contains('localhost'))
                throw new GradleException("Configure a deployed HTTPS ${key} before production.")
        }
    }
}
if (providers.gradleProperty('playProduction').getOrElse('false') == 'true') {
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyPlayProduction' }
}

