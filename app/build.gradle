plugins { id 'com.android.application' }

android {
    namespace 'com.dominic.photosweep'
    compileSdk 36
    defaultConfig {
        applicationId 'com.dominic.photosweep'
        minSdk 30
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('PHOTO_SWEEP_KEYSTORE_PATH')
            if (keyPath) storeFile file(keyPath)
            storePassword System.getenv('PHOTO_SWEEP_STORE_PASSWORD')
            keyAlias 'photosweep'
            keyPassword System.getenv('PHOTO_SWEEP_STORE_PASSWORD')
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Present in the setup bundle so Play Console can enable product configuration.
// Guest/offline AppServices remains active until products and verification are configured.
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
}
